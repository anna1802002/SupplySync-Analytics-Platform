name: supplysync-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax check
        run: python -m compileall scripts analytics orchestration
      - name: Verify critical files exist
        run: |
          test -f dbt/dbt_project.yml
          test -f dbt/models/marts/kpi_supply_chain.sql
          test -f analytics/kpi_scorecard.py
      - name: Workflow sanity marker
        run: python -c "print('supplysync CI syntax checks passed')"
